name: Build Godot Engine 3.5
on: workflow_dispatch

jobs:
  build-linux:
    runs-on: ubuntu-latest # Versão recomendada para compatibilidade de binários
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            scons \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libglu-dev \
            libasound2-dev \
            libpulse-dev \
            libudev-dev \
            libxi-dev \
            libxrandr-dev

      - name: Compilar Engine (Editor)
        run: |
          # platform=x11 (para Godot 3.5 o Linux é identificado como x11)
          # tools=yes (builda o Editor; use no para export templates)
          # target=release_debug (otimizado mas com símbolos de debug)
          scons platform=x11 tools=yes target=release_debug -j$(nproc)

      - name: Upload Binário
        uses: actions/upload-artifact@v4
        with:
          name: godot-linux-binary
          path: bin/godot.x11.opt.tools.64
