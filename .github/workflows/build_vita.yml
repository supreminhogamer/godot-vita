name: Build Godot 3.x Vita Templates
on: 
  workflow_dispatch: # Permite rodar manualmente na aba Actions

jobs:
  build-vita-templates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source (Sua Engine)
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar SCons
        run: python -m pip install scons

      - name: Configurar VitaSDK
        uses: vitasdk/setup-vitasdk@v1
        with:
          version: master

      - name: Compilar Template Vita (Release)
        run: |
          # platform=vita é o nome usado no fork do SonicMastr
          scons platform=vita tools=no target=release -j$(nproc)

      - name: Compilar Template Vita (Debug)
        run: |
          scons platform=vita tools=no target=release_debug -j$(nproc)

      - name: Empacotar no formato .tpz
        run: |
          # 1. Cria a pasta exigida pela estrutura de templates do Godot
          mkdir templates
          
          # 2. Copia os binários gerados. 
          # O fork godot-vita costuma gerar arquivos .arm ou .elf na pasta bin/
          # Tentamos copiar ambos para garantir compatibilidade com diferentes commits do fork
          cp bin/godot.vita.opt.arm templates/vita_release.elf || cp bin/godot.vita.opt.elf templates/vita_release.elf
          cp bin/godot.vita.opt.debug.arm templates/vita_debug.elf || cp bin/godot.vita.opt.debug.elf templates/vita_debug.elf
          
          # 3. Cria o version.txt com a sua versão
          echo "3.7.dev" > templates/version.txt
          
          # 4. Zipa tudo com a extensão .tpz
          zip -r godot_vita_templates.tpz templates/

      - name: Upload do Template TPZ
        uses: actions/upload-artifact@v4
        with:
          name: godot-vita-tpz
          path: godot_vita_templates.tpz
