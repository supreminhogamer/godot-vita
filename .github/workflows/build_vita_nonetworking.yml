name: 🎮 PSVita Release Build (Fast)
on:
  workflow_dispatch:

env:
  # Flags otimizadas para velocidade e compatibilidade
  SCONSFLAGS: verbose=yes warnings=all werror=no debug_symbols=no CXXFLAGS="-Drestrict="
  VITASDK: /usr/local/vitasdk

jobs:
  build-vita:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Python and SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install scons

      - name: Setup VitaSDK via VDPM
        run: |
          # Instala dependências de build do sistema
          sudo apt-get update
          sudo apt-get install cmake libarchive-tools fakeroot zip -y
          
          # Setup do SDK (Esta parte é necessária e demora um pouco)
          git clone https://github.com/vitasdk/vdpm
          cd vdpm
          ./bootstrap-vitasdk.sh
          ./install-all.sh
          export PATH=$VITASDK/bin:$PATH
          
          # Instala libdl e PVR_PSP2 (Essencial para o seu fork)
          ./vdpm vita-rss-libdl
          git clone https://github.com/isage/vita-packages-extra /tmp/vita-packages-extra
          cd /tmp/vita-packages-extra/pvr_psp2
          $VITASDK/bin/vita-makepkg
          $VITASDK/bin/vdpm *.tar.xz
          
          echo "VITASDK=$VITASDK" >> $GITHUB_ENV
          echo "$VITASDK/bin" >> $GITHUB_PATH

      - name: Compilar Template (Release)
        run: |
          # Compila apenas o alvo de Release
          scons platform=vita tools=no target=release \
          module_websocket_enabled=no \
          module_mbedtls_enabled=no \
          module_enet_enabled=no \
          ${{ env.SCONSFLAGS }} -j$(nproc)

          
          # Entra na pasta gerada e cria o zip interno que a Godot exige
          cd temp-build/vita_release
          zip -r ../../vita_release.zip *
          cd ../../

      - name: Empacotar no formato .tpz
        run: |
          mkdir -p templates
          
          # Move o zip de release para a pasta de templates
          if [ -f "vita_release.zip" ]; then
            mv vita_release.zip templates/
          else
            echo "Erro: vita_release.zip não foi gerado!"
            exit 1
          fi
          
          # Cria o arquivo de versão (ajuste se sua versão for diferente)
          echo "3.7.dev" > templates/version.txt
          
          # Gera o arquivo .tpz final
          zip -r godot_vita_release_only.tpz templates/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-vita-release-template
          path: godot_vita_release_only.tpz
